need: "Students struggle with difficult subjects and need quick help from someone who has already passed the course."
product: "Study Buddy"
category: "An AI-powered peer mentoring app for college students."
benefit: "Study Buddy aims to connect students with qualified peer mentors within 10 minutes. Our goal is to save students at least 30 minutes per help request and make it easier to understand difficult topics without spending hours searching for help."
alternative: "Students usually search Google, watch YouTube videos, or wait for classmates or professors to help."
difference: "Unlike Google or YouTube, Study Buddy uses AI to match students with available peer mentors who have already passed the same course, providing personalized academic support when students need it."
market: "Study Buddy targets college students in the Milwaukee region who need quick and affordable academic support. According to the Metropolitan Milwaukee Association of Commerce, the region had approximately 76,599 students enrolled across 20 higher education institutions (Fall 2021 data). Our initial goal is to test Study Buddy with 100 students. For our pilot, we estimate that each student could request help twice per month, creating approximately 200 mentoring requests monthly. We will survey students to determine how often they need tutoring and how much they are willing to pay."
